<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storage size debugger | opendb-store</title>
    <link rel="stylesheet" href="../../shared/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "opendb-store": "../../../dist/opendb-esm.js",
          "opendb-store/query": "../../../dist/query.js",
          "opendb-store/debug": "../../../dist/debug.js",
          "opendb-store/indexeddb": "../../../dist/indexeddb.js",
          "opendb-store/compress": "../../../dist/compress.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <a class="back" href="../../">All examples</a>
      <h1>Storage size debugger</h1>
      <p>See how much each storage is using, and which keys are the largest.</p>
      <div class="row">
        <button id="small">Add small entry</button>
        <button id="large">Add large entry</button>
        <button id="print">Print report to console</button>
        <button id="clear" class="secondary">Clear demo data</button>
      </div>
      <div id="reports"></div>
      <p class="hint">Percentages cover everything this site has stored. The limits are estimates.</p>
      <p class="source">Source: <code>public/examples/storage-debug/main.js</code></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
