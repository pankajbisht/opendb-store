<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme sync across tabs | opendb-store</title>
    <link rel="stylesheet" href="../../shared/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "opendb-store": "../../../dist/opendb-esm.js",
          "opendb-store/query": "../../../dist/query.js",
          "opendb-store/debug": "../../../dist/debug.js",
          "opendb-store/indexeddb": "../../../dist/indexeddb.js",
          "opendb-store/compress": "../../../dist/compress.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <a class="back" href="../../">All examples</a>
      <h1>Theme sync across tabs</h1>
      <p>Subscribers hear about changes from this tab and from your other tabs.</p>
      <div class="row">
        <button data-theme-choice="light">Light</button>
        <button data-theme-choice="dark">Dark</button>
      </div>
      <p>Current theme: <strong id="current"></strong></p>
      <p>Changes received: <strong id="changes">0</strong></p>
      <p class="hint"><a href="./" target="_blank">Open this page in a second tab</a>, then change the theme there.</p>
      <p class="source">Source: <code>public/examples/theme-sync/main.js</code></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
