<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basics | opendb-store</title>
    <link rel="stylesheet" href="../../shared/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "opendb-store": "../../../dist/opendb-esm.js",
          "opendb-store/query": "../../../dist/query.js",
          "opendb-store/debug": "../../../dist/debug.js",
          "opendb-store/indexeddb": "../../../dist/indexeddb.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <a class="back" href="../../">All examples</a>
      <h1>Basics</h1>
      <p>Save, read, check, and remove a value. It survives a page reload.</p>
      <form id="form" class="row">
        <label for="input">Your name</label>
        <input id="input" placeholder="Enter a name" required />
        <button>Save</button>
        <button type="button" id="remove" class="secondary">Remove</button>
      </form>
      <p>Stored name: <strong id="name"></strong></p>
      <p class="hint">Save a name, then reload the page.</p>
      <p class="source">Source: <code>public/examples/basics/main.js</code></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
