<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form autosave | opendb-store</title>
    <link rel="stylesheet" href="../../shared/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "opendb-store": "../../../dist/opendb-esm.js",
          "opendb-store/query": "../../../dist/query.js",
          "opendb-store/debug": "../../../dist/debug.js",
          "opendb-store/indexeddb": "../../../dist/indexeddb.js",
          "opendb-store/compress": "../../../dist/compress.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <a class="back" href="../../">All examples</a>
      <h1>Form autosave</h1>
      <p>Type, then reload. The draft stays in this tab until you submit it.</p>
      <form id="form" class="stack">
        <label>Title <input name="title" /></label>
        <label>Message <textarea name="message" rows="3"></textarea></label>
        <button>Submit</button>
      </form>
      <p id="status" class="hint"></p>
      <pre id="output"></pre>
      <p class="source">Source: <code>public/examples/form-draft/main.js</code></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
